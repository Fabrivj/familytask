<section class="hero">
  <div class="landing-container">
    <div class="hero-inner">

      <div class="hero-eyebrow">Para toda la familia — 2026</div>

      <h1 class="hero-title">
        <span class="accent">MISIONES</span><br>
        <span class="accent2">ÉPICAS</span><br>
        EN FAMILIA
      </h1>

      <p class="hero-tagline">
        Convierte las tareas del hogar en aventuras. Tus hijos ganan puntos,
        suben de nivel y desbloquean premios reales mientras construyen
        hábitos positivos.
      </p>

      <div class="hero-actions">
        <button class="landing-btn landing-btn-primary" (click)="ctaClicked.emit()">
          <mat-icon>rocket_launch</mat-icon> Comenzar gratis
        </button>
        <button class="landing-btn landing-btn-outline">
          <mat-icon>play_arrow</mat-icon> Ver demo
        </button>
      </div>

    </div>
  </div>
</section>
