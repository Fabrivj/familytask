<section class="cta-section">
  <div class="landing-container">
    <div class="cta-inner">
      <div class="landing-chip">¡Empieza hoy!</div>
      <h2 class="cta-title">¿Listo para que tu familia <span>empiece</span>?</h2>
      <p class="cta-desc">
        Crea tu grupo familiar, asigna misiones y observa cómo tus hijos
        construyen hábitos positivos mientras se divierten.
      </p>
      <button
        class="landing-btn landing-btn-primary cta-btn"
        (click)="ctaClicked.emit()"
      >
        <mat-icon>rocket_launch</mat-icon> Comenzar gratis
      </button>
    </div>
  </div>
</section>
