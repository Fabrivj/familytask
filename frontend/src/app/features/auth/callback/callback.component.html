<div class="page-container scanlines">

  @if (state() === 'processing') {
    <div class="card">
      <app-card-corners />
      <div class="card-header">
        <div class="tag">// VERIFICANDO</div>
        <div class="card-title">Iniciando sesión</div>
      </div>
      <div class="card-body center">
        <mat-progress-spinner
          mode="indeterminate"
          diameter="44"
          aria-label="Procesando inicio de sesión"
        />
        <p class="step-text">{{ currentStep() }}</p>
      </div>
    </div>
  }

  @if (state() === 'error') {
    <div class="card">
      <app-card-corners />
      <div class="card-header">
        <div class="tag tag-error">// ERROR</div>
        <span class="error-icon" aria-hidden="true">⚠️</span>
        <div class="card-title">Algo salió mal</div>
        <div class="card-sub">{{ errorMessage() }}</div>
      </div>
      <div class="cta-wrap">
        <button class="btn-full" type="button" (click)="goBackToLogin()">
          Volver al inicio
        </button>
      </div>
    </div>
  }

</div>
