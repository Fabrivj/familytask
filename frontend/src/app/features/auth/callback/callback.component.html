<app-page-layout>

  @if (state() === 'processing') {
    <app-neon-card [centered]="true">
      <ng-container card-header>
        <p class="tag">// VERIFICANDO</p>
        <h1 class="card-title">Iniciando sesión</h1>
      </ng-container>
      <mat-progress-spinner
        mode="indeterminate"
        diameter="44"
        aria-label="Procesando inicio de sesión"
      />
      <p class="step-text">{{ currentStep() }}</p>
    </app-neon-card>
  }

  @if (state() === 'error') {
    <div role="alert">
      <app-neon-card>
        <ng-container card-header>
          <p class="tag tag-error">// ERROR</p>
          <span class="error-icon" aria-hidden="true"><mat-icon>warning</mat-icon></span>
          <h1 class="card-title">Algo salió mal</h1>
          <p class="card-sub">{{ errorMessage() }}</p>
        </ng-container>
        <button card-cta class="btn-cta" type="button" (click)="goBackToLogin()">
          Volver al inicio
        </button>
      </app-neon-card>
    </div>
  }

</app-page-layout>
