<div class="callback-container">
  @if (state() === 'processing') {
    <div class="callback-card">
      <div class="spinner"></div>
      <p class="paso">{{ currentStep() }}</p>
    </div>
  }

  @if (state() === 'error') {
    <div class="callback-card error">
      <span class="error-icon">⚠️</span>
      <h2>Algo salió mal</h2>
      <p>{{ errorMessage() }}</p>
      <button (click)="goBackToLogin()">Volver al inicio</button>
    </div>
  }
</div>

<style>
  .callback-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .callback-card {
    background: white;
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    max-width: 380px;
    width: 100%;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #e0e0e0;
    border-top-color: #4285F4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .paso { color: #555; font-size: 16px; margin: 0; }
  .error-icon { font-size: 48px; display: block; margin-bottom: 16px; }
  .error h2 { color: #d32f2f; margin: 0 0 8px; }
  .error p { color: #666; margin: 0 0 24px; }
  button {
    padding: 12px 24px;
    background: #1a1a2e;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
</style>
