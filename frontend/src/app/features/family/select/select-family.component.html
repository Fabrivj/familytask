<app-page-layout variant="full">

  <app-top-bar
    [userName]="shortName()"
    [userEmail]="userEmail()"
    [userPictureUrl]="pictureUrl()"
    [showLogout]="true"
    [logoutLoading]="logoutLoading()"
    (logout)="logout()"
  />

  <main class="content">

    <app-page-header
      [tag]="'// BIENVENIDO DE VUELTA, ' + shortName().toUpperCase()"
      title="¿A qué familia entras hoy?"
      subtitle="Selecciona un grupo para acceder a su dashboard."
      [centered]="true"
    />

    @if (logoutError()) {
      <p class="error-banner" role="alert">{{ logoutError() }}</p>
    }

    <!-- Family cards grid -->
    <div class="families-grid">

      @for (familia of families(); track familia.familyId) {
        <div
          class="family-card"
          [class.active]="isSelected(familia.familyId)"
          role="article"
          [attr.aria-label]="'Familia ' + familia.familyName"
          (click)="selectCard(familia.familyId)"
        >
          <div class="card-top">
            <div class="family-avatar" [class.avatar-active]="isSelected(familia.familyId)" aria-hidden="true">
              <mat-icon>home</mat-icon>
            </div>
            <h2 class="family-name" [class.name-active]="isSelected(familia.familyId)">{{ familia.familyName }}</h2>
            <app-role-badge [role]="familia.role" />
          </div>

          <div class="card-stats">
            <div class="stat-row">
              <span class="stat-label">MIEMBROS</span>
              <span class="stat-value">{{ familia.memberCount ?? '—' }}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">TAREAS ACTIVAS</span>
              <span class="stat-value">{{ familia.activeTaskCount ?? '—' }}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">TU ROL</span>
              <span class="stat-value">{{ getRoleShort(familia.role) }}</span>
            </div>
          </div>

          <button
            class="btn-enter"
            [class.btn-enter-active]="isSelected(familia.familyId)"
            type="button"
            (click)="$event.stopPropagation(); select(familia.familyId)"
          >
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            ENTRAR
          </button>
        </div>
      }

      <!-- New family card -->
      <div
        class="family-card new-card"
        role="button"
        tabindex="0"
        aria-label="Crear nueva familia"
        (click)="createNew()"
        (keyup.enter)="createNew()"
      >
        <div class="new-card-content">
          <div class="new-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="new-label">NUEVA FAMILIA</span>
        </div>
      </div>

    </div>

  </main>

</app-page-layout>
