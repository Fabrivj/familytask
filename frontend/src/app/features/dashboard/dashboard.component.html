<app-shell>
  <main class="content">

    @if (successMessage()) {
      <p class="msg-success" role="status"><mat-icon>check</mat-icon> {{ successMessage() }}</p>
    }

    <app-page-header
      title="Tu panel familiar"
    />

    @if ((session()?.families ?? []).length > 0) {
      <section class="section">
        <h2 class="section-label">Tus familias</h2>
        <div class="chips">
          @for (familia of session()!.families; track familia.familyId) {
            <div class="chip">
              <strong class="chip-name">{{ familia.familyName }}</strong>
              <span class="chip-role">
                <app-role-badge [role]="familia.role" />
              </span>
            </div>
          }
        </div>
      </section>
    } @else {
      <p class="empty-msg">
        Aún no perteneces a ninguna familia.
        <a class="empty-link" routerLink="/family/new">Crear una →</a>
      </p>
    }

  </main>
</app-shell>
