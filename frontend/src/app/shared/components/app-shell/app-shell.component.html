<a href="#main-content" class="a11y-skip-link">Saltar al contenido principal</a>

<app-page-layout variant="full">
  <div class="app-body">
    <app-sidebar />

    <div class="content-col">
      <app-top-bar
        [userName]="shortName()"
        [userPictureUrl]="pictureUrl()"
        [familyName]="familyName()"
        [userRole]="userRole()"
        [showLogout]="true"
        [logoutLoading]="logoutLoading()"
        (logout)="onLogout()"
      />

      <div id="main-content" tabindex="-1">
        <ng-content />
      </div>
    </div>
  </div>
</app-page-layout>
